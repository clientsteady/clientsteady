name: ClientSteady AI Advisory Board

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Business or product question to evaluate'
        required: true
        type: string
      context_files:
        description: 'Comma-separated repo files to include as context'
        required: false
        default: 'index.html'
        type: string
      openai_model:
        description: 'OpenAI model'
        required: false
        default: 'gpt-5.6'
        type: string
      anthropic_model:
        description: 'Anthropic model ID'
        required: false
        default: 'claude-sonnet-4-20250514'
        type: string
      commit_review:
        description: 'Commit the generated review back to this repo'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  advisory-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run AI advisory board
        id: advisory
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADVISORY_TASK: ${{ inputs.task }}
          CONTEXT_FILES: ${{ inputs.context_files }}
          OPENAI_MODEL: ${{ inputs.openai_model }}
          ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
          OUTPUT_DIR: docs/ai-reviews
        run: node scripts/advisory-board.js

      - name: Commit review to repository
        if: ${{ inputs.commit_review }}
        env:
          REVIEW_PATH: ${{ steps.advisory.outputs.review_path }}
        run: |
          git config user.name "clientsteady-ai-board[bot]"
          git config user.email "clientsteady-ai-board[bot]@users.noreply.github.com"
          git add "$REVIEW_PATH"
          git commit -m "Add AI advisory board review" || exit 0
          git push

      - name: Show generated file
        run: |
          echo "Generated review: ${{ steps.advisory.outputs.review_path }}"
          echo "Open the file in docs/ai-reviews/ to read the full OpenAI → Claude → OpenAI review."
