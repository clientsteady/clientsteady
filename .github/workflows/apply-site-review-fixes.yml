name: Apply site review fixes

on:
  push:
    branches:
      - agent/site-review-fixes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-review-fixes
          fetch-depth: 0

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected_min=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < expected_min:
                  raise SystemExit(f"Expected at least {expected_min} match(es) in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new))
              print(f"{path}: replaced {count} occurrence(s)")

          def add_demo_notice(path):
              p = Path(path)
              text = p.read_text()
              if 'name="robots" content="noindex,nofollow"' not in text:
                  text = text.replace('</head>', '<meta name="robots" content="noindex,nofollow">\n</head>', 1)
              notice = '<div style="background:#4A9EFF;color:#06101c;text-align:center;padding:8px 16px;font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em">Interactive ClientSteady Demo · Sample business and sample data</div>'
              if 'Interactive ClientSteady Demo · Sample business and sample data' not in text:
                  text = text.replace('<body>', '<body>\n' + notice, 1)
              p.write_text(text)

          # Clearly mark all demo experiences as fictional/sample and keep them out of search indexes.
          for demo in [
              'bella-beauty-medspa.html',
              'bella-beauty-owner-demo.html',
              'luxe-cuts-salon.html',
              'luxe-cuts-owner-demo.html',
          ]:
              add_demo_notice(demo)

          # Luxe Cuts: remove med-spa copy/paste leftovers and align services/pricing with a salon.
          replace('luxe-cuts-salon.html',
                  'alt="Relaxing facial treatment at Luxe Cuts &amp; Color Studio"',
                  'alt="Modern luxury hair salon interior at Luxe Cuts &amp; Color Studio"')
          replace('luxe-cuts-salon.html',
                  '<div><span class="service-price">From $12/unit</span><span class="service-duration">· 30 min</span></div>',
                  '<div><span class="service-price">From $85</span><span class="service-duration">· 60 min</span></div>')
          replace('luxe-cuts-salon.html',
                  'Restore volume, define contours, and enhance lips using FDA-approved hyaluronic acid fillers.',
                  'Dimensional color and highlights tailored to your skin tone, maintenance goals, and personal style.')
          replace('luxe-cuts-salon.html',
                  '<div><span class="service-price">From $450</span><span class="service-duration">· 45 min</span></div>',
                  '<div><span class="service-price">From $165</span><span class="service-duration">· 2 hrs</span></div>')
          replace('luxe-cuts-salon.html',
                  'Deep cleanse, extract, and hydrate your skin in one relaxing treatment. Suitable for all skin types.',
                  'A polished wash, blow-dry, and finish customized for smooth volume, movement, or event-ready styling.')
          replace('luxe-cuts-salon.html',
                  '<div><span class="service-price">From $185</span><span class="service-duration">· 60 min</span></div>',
                  '<div><span class="service-price">From $65</span><span class="service-duration">· 45 min</span></div>')
          replace('luxe-cuts-salon.html', '<div class="service-name">Laser Treatments</div>', '<div class="service-name">Keratin Treatments</div>')
          replace('luxe-cuts-salon.html',
                  'Target pigmentation, redness, hair, and skin texture with our medical-grade laser systems.',
                  'Smooth frizz, reduce styling time, and add lasting shine with a customized keratin smoothing service.')
          replace('luxe-cuts-salon.html',
                  '<div><span class="service-price">From $250</span><span class="service-duration">· 45 min</span></div>',
                  '<div><span class="service-price">From $250</span><span class="service-duration">· 2.5 hrs</span></div>')
          replace('luxe-cuts-salon.html',
                  'Resurface dull, uneven skin with custom-blended peels for a brighter, smoother complexion.',
                  'Add natural-looking length and fullness with professionally matched, blended, and installed extensions.')
          replace('luxe-cuts-salon.html',
                  '<div><span class="service-price">From $160</span><span class="service-duration">· 45 min</span></div>',
                  '<div><span class="service-price">From $350</span><span class="service-duration">· 2.5 hrs</span></div>')
          replace('luxe-cuts-salon.html',
                  'Stimulate collagen production to improve texture, fine lines, and acne scars. Add PRP for enhanced results.',
                  'Hand-painted dimensional color designed for a soft grow-out, natural contrast, and effortless maintenance.')
          replace('luxe-cuts-salon.html',
                  '<div><span class="service-price">From $295</span><span class="service-duration">· 75 min</span></div>',
                  '<div><span class="service-price">From $225</span><span class="service-duration">· 3 hrs</span></div>')

          replace('luxe-cuts-salon.html',
                  '<span class="cred-detail">Founder & Lead Injector</span>',
                  '<span class="cred-detail">Founder & Master Stylist</span>')
          replace('luxe-cuts-salon.html',
                  '<span class="cred-title">Board Certified, AANP</span>\n      <span class="cred-detail">Since 2012</span>',
                  '<span class="cred-title">Vidal Sassoon Trained</span>\n      <span class="cred-detail">Advanced cutting & color</span>')
          replace('luxe-cuts-salon.html',
                  '<span class="cred-title">Allergan Diamond Provider</span>\n      <span class="cred-detail">Top 1% nationally</span>',
                  '<span class="cred-title">18 years behind the chair</span>\n      <span class="cred-detail">Color & transformation specialist</span>')
          replace('luxe-cuts-salon.html',
                  '<span class="cred-title">3,000+ procedures performed</span>\n      <span class="cred-detail">Zero serious complications</span>',
                  '<span class="cred-title">3,000+ client appointments</span>\n      <span class="cred-detail">Cuts, color & styling</span>')
          replace('luxe-cuts-salon.html',
                  '"The Blowouts &amp; Styling left my skin glowing for two weeks. Everyone kept asking what I was doing differently. The space is beautiful, staff is warm, and pricing is fair for the quality."',
                  '"My balayage came out exactly how I pictured it — dimensional, soft, and easy to maintain. The space is beautiful, the staff is warm, and I already booked my next visit."')
          replace('luxe-cuts-salon.html',
                  '<div class="reviewer-meta">Blowouts &amp; Styling · Colleyville, TX · 2 months ago</div>',
                  '<div class="reviewer-meta">Balayage · Colleyville, TX · 2 months ago</div>')

          replace('luxe-cuts-salon.html',
                  "selectService(this,'Color &amp; Highlights','From $450','45 min')",
                  "selectService(this,'Color &amp; Highlights','From $165','2 hrs')")
          replace('luxe-cuts-salon.html',
                  "selectService(this,'Blowouts &amp; Styling','From $185','60 min')",
                  "selectService(this,'Extensions','From $350','2.5 hrs')")
          replace('luxe-cuts-salon.html',
                  '<span class="pill-name">Blowouts &amp; Styling</span>\n          <span class="pill-price">From $185 · 60 min</span>',
                  '<span class="pill-name">Extensions</span>\n          <span class="pill-price">From $350 · 2.5 hrs</span>')
          replace('luxe-cuts-salon.html',
                  "selectService(this,'Balayage','From $295','75 min')",
                  "selectService(this,'Balayage','From $225','3 hrs')")
          replace('luxe-cuts-salon.html',
                  '<span class="pill-price">From $295 · 75 min</span>',
                  '<span class="pill-price">From $225 · 3 hrs</span>')

          # Luxe owner demo: correct the copied med-spa net-gain figure.
          replace('luxe-cuts-owner-demo.html',
                  '<span class="rev-val gold" style="font-size:1rem">$2,441</span>',
                  '<span class="rev-val gold" style="font-size:1rem">$1,581</span>')

          # Owner demos: replace broken homepage-style mobile links with working dashboard navigation.
          old_mobile = '''<div class="mobile-menu" id="mobileMenu">\n  <a href="#how" onclick="closeMenu()">How It Works</a>\n  <a href="#automations" onclick="closeMenu()">Automations</a>\n  <a href="#pricing" onclick="closeMenu()">Pricing</a>\n  <a href="#demo" onclick="closeMenu()">Demo</a>\n  <a href="#" class="mob-cta" onclick="closeMenu();openModal(event)">Book a Demo →</a>\n</div>'''
          new_mobile = '''<div class="mobile-menu" id="mobileMenu">\n  <a href="#" onclick="closeMenu();showPage('pain', document.querySelectorAll('.nav-tab')[0]);return false">Revenue Problem</a>\n  <a href="#" onclick="closeMenu();showPage('dashboard', document.querySelectorAll('.nav-tab')[1]);return false">Dashboard</a>\n  <a href="#" onclick="closeMenu();showPage('smsflow', document.querySelectorAll('.nav-tab')[2]);return false">Automations</a>\n  <a href="index.html#demo" class="mob-cta">Back to ClientSteady →</a>\n</div>'''
          for owner_demo in ['bella-beauty-owner-demo.html', 'luxe-cuts-owner-demo.html']:
              replace(owner_demo, old_mobile, new_mobile)

          # Add-ons: move stray mobile-menu JavaScript back inside the HTML document.
          p = Path('clientsteady-addons.html')
          text = p.read_text()
          marker = '</body>\n</html>\n// ── Mobile menu ──'
          if marker not in text:
              raise SystemExit('Could not find malformed add-ons JavaScript marker')
          before, js = text.split(marker, 1)
          text = before.rstrip() + '\n<script>\n// ── Mobile menu ──' + js.rstrip() + '\n</script>\n</body>\n</html>\n'
          p.write_text(text)

          # Remove this one-time workflow from the final branch contents.
          Path('.github/workflows/apply-site-review-fixes.yml').unlink()

      - name: Validate HTML basics
        run: |
          python - <<'PY'
          from pathlib import Path
          files = ['index.html','clientsteady-addons.html','bella-beauty-medspa.html','bella-beauty-owner-demo.html','luxe-cuts-salon.html','luxe-cuts-owner-demo.html']
          for f in files:
              t = Path(f).read_text()
              assert t.count('<html') == 1, f
              assert t.count('</html>') == 1, f
              assert t.count('<body') == 1, f
              assert t.count('</body>') == 1, f
          assert '$1,581' in Path('luxe-cuts-owner-demo.html').read_text()
          assert 'Founder & Lead Injector' not in Path('luxe-cuts-salon.html').read_text()
          assert 'FDA-approved hyaluronic acid fillers' not in Path('luxe-cuts-salon.html').read_text()
          assert Path('clientsteady-addons.html').read_text().rstrip().endswith('</html>')
          print('HTML validation passed')
          PY

      - name: Commit fixes
        run: |
          git config user.name "ClientSteady Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bella-beauty-medspa.html bella-beauty-owner-demo.html luxe-cuts-salon.html luxe-cuts-owner-demo.html clientsteady-addons.html .github/workflows/apply-site-review-fixes.yml
          git commit -m "fix reviewed site issues"
          git push origin agent/site-review-fixes
