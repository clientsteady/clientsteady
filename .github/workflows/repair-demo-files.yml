name: Repair and sync demo files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair demo files
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, min_count=1):
              p=Path(path); t=p.read_text(); c=t.count(old)
              if c < min_count:
                  raise SystemExit(f'{path}: expected {min_count}+ matches, found {c}: {old[:100]!r}')
              p.write_text(t.replace(old,new))
              print(f'{path}: replaced {c}')

          def ensure_demo_meta_and_banner(path):
              p=Path(path); t=p.read_text()
              if 'name="robots" content="noindex,nofollow"' not in t:
                  t=t.replace('<meta charset="UTF-8">','<meta charset="UTF-8">\n<meta name="robots" content="noindex,nofollow">',1)
              banner='Interactive ClientSteady Demo &nbsp;·&nbsp; Sample business and sample data'
              if banner not in t and 'Interactive ClientSteady Demo' not in t:
                  notice='<div style="background:#1A3A5C;color:rgba(255,255,255,0.75);text-align:center;padding:0.5rem 1rem;font-family:Inter,sans-serif;font-size:0.72rem;letter-spacing:0.08em;position:relative;z-index:999">'+banner+'</div>'
                  t=t.replace('<body>','<body>\n<!-- Demo Disclosure Banner -->\n'+notice,1)
              p.write_text(t)

          # Client-facing demos: preserve working JS, add disclosure/noindex/consent.
          for f in ['bella-beauty-medspa.html','luxe-cuts-salon.html']:
              ensure_demo_meta_and_banner(f)
              p=Path(f); t=p.read_text()
              consent='By entering your number you agree to receive automated demo text messages from ClientSteady.'
              if consent not in t:
                  needle='style="width:100%;padding:0.65rem 0.85rem;background:#0D1118;border:0.5px solid rgba(255,255,255,0.15);color:#F0EDE8;font-family:Inter,sans-serif;font-size:0.88rem;border-radius:5px;outline:none;box-sizing:border-box;" />'
                  if needle in t:
                      t=t.replace(needle,needle+'\n          <p style="font-size:0.68rem;color:rgba(240,237,232,0.4);margin-top:0.5rem;line-height:1.6">By entering your number you agree to receive automated demo text messages from ClientSteady. Msg &amp; data rates may apply. Reply STOP to opt out. <a href="/privacy.html" style="color:rgba(74,158,255,0.6)">Privacy</a> · <a href="/terms.html" style="color:rgba(74,158,255,0.6)">Terms</a></p>',1)
                  else:
                      raise SystemExit(f'{f}: demo phone input marker missing')
              # Merge duplicated style attributes if still present.
              t=t.replace('id="cs-demo-banner" style="display:none!important" style="','id="cs-demo-banner" style="display:none!important;')
              p.write_text(t)

          # Luxe Cuts full salon content cleanup.
          reps=[
            ('alt="Relaxing facial treatment at Luxe Cuts &amp; Color Studio"','alt="Modern luxury hair salon interior at Luxe Cuts &amp; Color Studio"'),
            ('<div><span class="service-price">From $12/unit</span><span class="service-duration">· 30 min</span></div>','<div><span class="service-price">From $85</span><span class="service-duration">· 60 min</span></div>'),
            ('Restore volume, define contours, and enhance lips using FDA-approved hyaluronic acid fillers.','Dimensional color and highlights tailored to your skin tone, maintenance goals, and personal style.'),
            ('<div><span class="service-price">From $450</span><span class="service-duration">· 45 min</span></div>','<div><span class="service-price">From $165</span><span class="service-duration">· 2 hrs</span></div>'),
            ('Deep cleanse, extract, and hydrate your skin in one relaxing treatment. Suitable for all skin types.','A polished wash, blow-dry, and finish customized for smooth volume, movement, or event-ready styling.'),
            ('<div><span class="service-price">From $185</span><span class="service-duration">· 60 min</span></div>','<div><span class="service-price">From $65</span><span class="service-duration">· 45 min</span></div>'),
            ('<div class="service-name">Laser Treatments</div>','<div class="service-name">Keratin Treatments</div>'),
            ('Target pigmentation, redness, hair, and skin texture with our medical-grade laser systems.','Smooth frizz, reduce styling time, and add lasting shine with a customized keratin smoothing service.'),
            ('<div><span class="service-price">From $250</span><span class="service-duration">· 45 min</span></div>','<div><span class="service-price">From $250</span><span class="service-duration">· 2.5 hrs</span></div>'),
            ('Resurface dull, uneven skin with custom-blended peels for a brighter, smoother complexion.','Add natural-looking length and fullness with professionally matched, blended, and installed extensions.'),
            ('<div><span class="service-price">From $160</span><span class="service-duration">· 45 min</span></div>','<div><span class="service-price">From $350</span><span class="service-duration">· 2.5 hrs</span></div>'),
            ('Stimulate collagen production to improve texture, fine lines, and acne scars. Add PRP for enhanced results.','Hand-painted dimensional color designed for a soft grow-out, natural contrast, and effortless maintenance.'),
            ('<div><span class="service-price">From $295</span><span class="service-duration">· 75 min</span></div>','<div><span class="service-price">From $225</span><span class="service-duration">· 3 hrs</span></div>'),
            ('<span class="cred-detail">Founder & Lead Injector</span>','<span class="cred-detail">Founder & Master Stylist</span>'),
            ('<span class="cred-title">Board Certified, AANP</span>\n      <span class="cred-detail">Since 2012</span>','<span class="cred-title">Vidal Sassoon Trained</span>\n      <span class="cred-detail">Advanced Cutting & Color</span>'),
            ('<span class="cred-title">Allergan Diamond Provider</span>\n      <span class="cred-detail">Top 1% nationally</span>','<span class="cred-title">18 Years Behind the Chair</span>\n      <span class="cred-detail">Color & Transformation Specialist</span>'),
            ('<span class="cred-title">3,000+ procedures performed</span>\n      <span class="cred-detail">Zero serious complications</span>','<span class="cred-title">3,000+ client appointments</span>\n      <span class="cred-detail">Cuts, color & styling</span>'),
            ('"The Blowouts &amp; Styling left my skin glowing for two weeks. Everyone kept asking what I was doing differently. The space is beautiful, staff is warm, and pricing is fair for the quality."','"My balayage came out exactly how I pictured it — dimensional, soft, and easy to maintain. The space is beautiful, the staff is warm, and I already booked my next visit."'),
            ('<div class="reviewer-meta">Blowouts &amp; Styling · Colleyville, TX · 2 months ago</div>','<div class="reviewer-meta">Balayage · Colleyville, TX · 2 months ago</div>'),
            ("selectService(this,'Color &amp; Highlights','From $450','45 min')","selectService(this,'Color &amp; Highlights','From $165','2 hrs')"),
            ("selectService(this,'Blowouts &amp; Styling','From $185','60 min')","selectService(this,'Extensions','From $350','2.5 hrs')"),
            ('<span class="pill-name">Blowouts &amp; Styling</span>\n          <span class="pill-price">From $185 · 60 min</span>','<span class="pill-name">Extensions</span>\n          <span class="pill-price">From $350 · 2.5 hrs</span>'),
            ("selectService(this,'Balayage','From $295','75 min')","selectService(this,'Balayage','From $225','3 hrs')"),
            ('<span class="pill-price">From $295 · 75 min</span>','<span class="pill-price">From $225 · 3 hrs</span>')
          ]
          p=Path('luxe-cuts-salon.html'); t=p.read_text()
          for old,new in reps:
              if old in t: t=t.replace(old,new)
          p.write_text(t)

          # Owner demos: noindex, sample labeling and correct mobile navigation.
          for f in ['bella-beauty-owner-demo.html','luxe-cuts-owner-demo.html']:
              ensure_demo_meta_and_banner(f)
              p=Path(f); t=p.read_text()
              t=t.replace('<div class="live-dot">Live · Updating now</div>','<div class="live-dot">Interactive Demo · Sample Data</div>')
              old='''<div class="mobile-menu" id="mobileMenu">\n  <a href="#how" onclick="closeMenu()">How It Works</a>\n  <a href="#automations" onclick="closeMenu()">Automations</a>\n  <a href="#pricing" onclick="closeMenu()">Pricing</a>\n  <a href="#demo" onclick="closeMenu()">Demo</a>\n  <a href="#" class="mob-cta" onclick="closeMenu();openModal(event)">Book a Demo →</a>\n</div>'''
              new='''<div class="mobile-menu" id="mobileMenu">\n  <a href="#" onclick="closeMenu();showPage('pain',document.querySelectorAll('.nav-tab')[0]);return false">The Problem</a>\n  <a href="#" onclick="closeMenu();showPage('dashboard',document.querySelectorAll('.nav-tab')[1]);return false">Dashboard</a>\n  <a href="#" onclick="closeMenu();showPage('smsflow',document.querySelectorAll('.nav-tab')[2]);return false">Automations</a>\n  <a href="#" onclick="closeMenu();showPage('roi',document.querySelectorAll('.nav-tab')[3]);return false">ROI Calculator</a>\n  <a href="https://clientsteady.com/#pricing" class="mob-cta" onclick="closeMenu()">Get Started →</a>\n</div>'''
              if old in t: t=t.replace(old,new)
              p.write_text(t)

          # Correct Luxe owner ROI wherever the copied Bella value remains.
          p=Path('luxe-cuts-owner-demo.html'); t=p.read_text()
          t=t.replace('<span class="rev-val gold" style="font-size:1rem">$2,441</span>','<span class="rev-val gold" style="font-size:1rem">$1,581</span>')
          t=t.replace('Net after subscription: +$2,441','Net after subscription: +$1,581')
          p.write_text(t)

          # Remove this one-time workflow in the same commit.
          Path('.github/workflows/repair-demo-files.yml').unlink()

      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          files=['bella-beauty-medspa.html','luxe-cuts-salon.html','bella-beauty-owner-demo.html','luxe-cuts-owner-demo.html']
          for f in files:
              t=Path(f).read_text()
              assert t.count('<html')==1 and t.count('</html>')==1, f
              assert t.count('<body')==1 and t.count('</body>')==1, f
              assert t.count('<style')==t.count('</style>'), f
              assert t.count('<script')==t.count('</script>'), f
              assert 'name="robots" content="noindex,nofollow"' in t, f
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.S|re.I)
              js='\n'.join(scripts)
              tmp=Path('/tmp')/(f+'.js'); tmp.write_text(js)
              r=subprocess.run(['node','--check',str(tmp)],capture_output=True,text=True)
              assert r.returncode==0, f+' JS: '+r.stderr
          luxe=Path('luxe-cuts-salon.html').read_text()
          assert 'Founder & Lead Injector' not in luxe
          assert 'FDA-approved hyaluronic acid fillers' not in luxe
          assert 'Top 1% nationally' not in luxe
          assert '$1,581' in Path('luxe-cuts-owner-demo.html').read_text()
          print('validation passed')
          PY

      - name: Commit repaired demos
        run: |
          git config user.name "ClientSteady Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bella-beauty-medspa.html luxe-cuts-salon.html bella-beauty-owner-demo.html luxe-cuts-owner-demo.html .github/workflows/repair-demo-files.yml
          git commit -m "repair and sync demo pages"
          git push origin main
